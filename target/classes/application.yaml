spring:
  application:
    name: security
  h2:
    console:
      enabled: true
  output:
    ansi:
      enabled: ALWAYS
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

sql:
  init:
    mode: always


logging:
  level:
    org:
      springframework:
        security: ERROR
  pattern:
    console: "%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread])
      %yellow(%logger{15}) - %msg%n"

server:
  ssl:
    enabled: true


